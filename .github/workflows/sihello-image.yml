name: Publish SiHello docker image

on:
  push:
    branches:
      - "sihello/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set edition to ee (parity with the official production image)
        run: |
          echo -en "\nENV CW_EDITION=\"ee\"" >> docker/Dockerfile

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/zesks/sihello:v4.16.2-sihello.2
            ghcr.io/zesks/sihello:latest-sihello
          cache-from: type=gha
          cache-to: type=gha,mode=max
